[package]
name = "kwybars"
description = "Audio visualizer overlay for Wayland desktops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
lexopt = "0.3"
pipewire = "0.10"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
thiserror = "2"
time = { version = "0.3", features = ["local-offset", "macros"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std", "time"] }

[dev-dependencies]
# compares the new config parser against the legacy one until phase 2
kwybars-common = { path = "crates/common" }

[lints]
workspace = true

[workspace]
# The legacy crates stay until Phase 2 of the rewrite removes them.
members = [".", "crates/common", "crates/control", "crates/daemon", "crates/engine", "crates/overlay"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.2.0"
authors = ["Nauris Steins"]
repository = "https://github.com/naurissteins/kwybars"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
self_named_module_files = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
