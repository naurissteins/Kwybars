name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the packaged artifact"
        required: false
        default: "manual"
      artifact_name:
        description: "Artifact name for manual packaging test uploads"
        required: false
        default: "kwybars-release-preview"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rust-cache

      - name: Install System Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            dpkg-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            pkg-config \
            rpm

      - name: Build Optimized Release
        run: cargo build --locked --release

      - name: Show Release Binary Size
        run: ls -lh target/release/kwybars

      - name: Package Release Tarball
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/tarball/build-tarball.sh "$version" dist

      - name: Package Debian package
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            if [[ ! "$version" =~ ^[0-9] ]]; then
              crate_version="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
              version="${crate_version}~${version}"
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/deb/build-deb.sh "$version" dist

      - name: Package RPM package
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            artifact_version="${{ github.event.inputs.version }}"
            package_version="$artifact_version"
            if [[ ! "$package_version" =~ ^[0-9] ]]; then
              crate_version="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
              package_version="${crate_version}~${package_version}"
            fi
          else
            artifact_version="${GITHUB_REF_NAME#v}"
            package_version="$artifact_version"
          fi
          bash packaging/rpm/build-rpm.sh \
            "$package_version" \
            dist \
            "dist/kwybars-${artifact_version}-x86_64-linux.tar.gz"

      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kwybars-*-x86_64-linux.tar.gz
            dist/kwybars_*_amd64.deb
            dist/kwybars-*.rpm

      - name: Upload Manual Packaging Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            dist/kwybars-*-x86_64-linux.tar.gz
            dist/kwybars_*_amd64.deb
            dist/kwybars-*.rpm
