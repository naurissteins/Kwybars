name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the packaged artifact"
        required: false
        default: "manual"
      artifact_name:
        description: "Artifact name for manual packaging test uploads"
        required: false
        default: "kwybars-release-preview"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rust-cache

      - name: Install System Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            dpkg-dev \
            pkg-config \
            rpm \
            git \
            meson \
            ninja-build \
            valac \
            gobject-introspection \
            libclang-dev \
            libgirepository1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libwayland-dev \
            wayland-protocols

          if ! pkg-config --exists gtk4-layer-shell-0; then
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
            meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
            sudo ldconfig
          fi

      - name: Build Optimized Release
        run: cargo build --locked --release --workspace

      - name: Show Release Binary Sizes
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh \
            target/release/kwybars-overlay \
            target/release/kwybars-daemon \
            target/release/kwybarsctl

      - name: Package Release Tarball
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          dist_dir="dist/kwybars-${version}-x86_64-linux"

          rm -rf "$dist_dir"
          mkdir -p \
            "$dist_dir/themes" \
            "$dist_dir/share/man/man1"

          install -m755 target/release/kwybars-overlay "$dist_dir/kwybars-overlay"
          install -m755 target/release/kwybars-daemon "$dist_dir/kwybars-daemon"
          install -m755 target/release/kwybarsctl "$dist_dir/kwybarsctl"
          install -m644 assets/systemd/kwybars-daemon.service "$dist_dir/kwybars-daemon.service"
          install -m644 assets/examples/config.toml "$dist_dir/config.toml"
          install -m644 assets/themes/*.toml "$dist_dir/themes/"
          install -m644 docs/man/*.1 "$dist_dir/share/man/man1/"
          install -m644 README.md "$dist_dir/README.md"
          install -m644 LICENSE "$dist_dir/LICENSE"

          tar -C dist -czf "dist/kwybars-${version}-x86_64-linux.tar.gz" "kwybars-${version}-x86_64-linux"

      - name: Package Debian package
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            if [[ ! "$version" =~ ^[0-9] ]]; then
              crate_version="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
              version="${crate_version}~${version}"
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/deb/build-deb.sh "$version" dist

      - name: Package RPM package
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            artifact_version="${{ github.event.inputs.version }}"
            package_version="$artifact_version"
            if [[ ! "$package_version" =~ ^[0-9] ]]; then
              crate_version="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
              package_version="${crate_version}~${package_version}"
            fi
          else
            artifact_version="${GITHUB_REF_NAME#v}"
            package_version="$artifact_version"
          fi
          bash packaging/rpm/build-rpm.sh \
            "$package_version" \
            dist \
            "dist/kwybars-${artifact_version}-x86_64-linux.tar.gz"

      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kwybars-*-x86_64-linux.tar.gz
            dist/kwybars_*_amd64.deb
            dist/kwybars-*.rpm

      - name: Upload Manual Packaging Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            dist/kwybars-*-x86_64-linux.tar.gz
            dist/kwybars_*_amd64.deb
            dist/kwybars-*.rpm
