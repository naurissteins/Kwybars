name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            gobject-introspection \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            meson \
            ninja-build \
            pkg-config \
            valac \
            wayland-protocols

          if ! pkg-config --exists gtk4-layer-shell-0; then
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
            meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
            sudo ldconfig
          fi
      - run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            gobject-introspection \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            meson \
            ninja-build \
            pkg-config \
            valac \
            wayland-protocols

          if ! pkg-config --exists gtk4-layer-shell-0; then
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
            meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
            sudo ldconfig
          fi
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            gobject-introspection \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            meson \
            ninja-build \
            pkg-config \
            valac \
            wayland-protocols

          if ! pkg-config --exists gtk4-layer-shell-0; then
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
            meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
            sudo ldconfig
          fi
      - run: cargo test --workspace

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ./scripts/check-deps

  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            gobject-introspection \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            meson \
            ninja-build \
            pkg-config \
            valac \
            wayland-protocols

          if ! pkg-config --exists gtk4-layer-shell-0; then
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
            meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
            sudo ldconfig
          fi
      - run: cargo build --locked --release --workspace

  nix:
    name: Nix Package (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            flake_check: true
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            flake_check: false
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - if: matrix.flake_check
        run: nix flake check --print-build-logs
      - run: nix build .#packages.${{ matrix.system }}.default --print-build-logs
